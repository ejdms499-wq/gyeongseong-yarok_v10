})]})]})}function Zo({face:v="사회면",no:_,right:N,rightKo:d}){return o.jsxs("div",{className:"label",children:[o.jsx("b",{children:v}),_&&o.jsx("i",{children:_}),N&&o.jsx("em",{children:d?o.jsx(S,{ko:d,children:N}):N})]})}const ja=[{id:0,date:"1933.05.17",dateOld:"오월 십칠일",label:"첫 보도",labelOld:"처음 실림",image:"./image/Jukcheomjeong/articles-toned/19330517.jpg",title:"시내 형사 총출동, 팔방 활동도 수포",modernText:["1933년 5월 17일자 동아일보 2면(사회면)에 「유아 단두 사건」이 처음 실렸다.","시내 형사 십여 명이 팔방으로 수사에 나섰지만 모두 수포로 돌아갔고, 피해자인 아이의 신원조차 밝혀지지 않았다.",'기사는 "남녀를 분간할 수는 없으나 머리를 깎은 것을 보아 사내아이 같다"고 적었다. 같은 기사에는 관계자들이 범인을 "문둥병 환자의 짓이 아닌가" 짐작한다는 대목도 실렸다. 당시 한센병 환자를 향한 편견이 그대로 지면에 오른 것이다.','같은 날 서대문경찰서장은 "범행은 금일 새벽에 있었다고 봅니다. 원한이나 치정관계에서 나온 것이 아닌가 생각됩니다. 범행 현장은 딴 곳인 것 같습니다"라고 말했다.','경성제대 부검도 "머리를 짧게 잘랐으니 사내아이"라고 봤다. 그러나 23일 뒤 밝혀진 아이는 한 살 난 여자아이였다. 첫 보도의 추정부터 틀렸던 것이다.'],summary:["5월 17일자 2면에 사건이 처음 실렸다.","형사 십여 명이 팔방으로 나섰지만 수포로 돌아갔다.","부검은 사내아이로 봤지만, 뒤에 여자아이로 밝혀졌다.","범인을 한센병 환자로 짐작하는 편견이 지면에 실렸다."],keywords:["첫보도","형사총출동","신원미상","편견"]},{id:1,date:"1933.05.18",dateOld:"오월 십팔일",label:"이튿날 보도",labelOld:"이튿날 실림",image:"./image/Jukcheomjeong/articles-toned/19330518.jpg",title:"죽첨정 사건, 이튿날의 보도",modernText:["전날 첫 보도에 이어, 죽첨정 사건이 다시 동아일보 사회면에 실렸다.",'서장은 "아직 범인을 체포하지 못했습니다. 사건이 오리무중으로 들어간다고 꾸지람을 해도 하는 수 없습니다. 그러나 과학적 수사방법은 있습니다"라고 말했다.',"경찰은 사건 현장을 조사하고 관련 단서를 찾기 위한 수사에 착수했다. 당시 보도에는 초기 조사와 감정 결과를 바탕으로 한 내용도 함께 전해졌다.","이후 수사가 이어지면서 사건에 대한 새로운 사실들이 차례로 확인되기 시작한다."],summary:["전날에 이어 사건이 다시 보도됐다.","경찰이 현장 조사와 수사에 착수했다.","초기 조사 결과를 바탕으로 사건 내용이 보도됐다.","이후 후속 보도를 통해 사건의 내용이 계속 변화한다."],keywords:["죽첨정","후속보도","동아일보","1933년"]},{id:2,date:"1933.05.19",dateOld:"오월 십구일",label:"수사 난항",labelOld:"수사가 막힘",image:"./image/Jukcheomjeong/articles-toned/19330519.jpg",title:"계속되는 수사, 사건은 여전히 오리무중",modernText:["서대문경찰서는 죽첨정 사건의 단서를 찾기 위해 밤낮없이 수사를 이어갔다.","그러나 비가 내리면서 현장에 남아 있던 흔적이 사라질 가능성이 커졌고, 경찰은 아직 뚜렷한 성과를 얻지 못한 상태였다.","경찰은 긴장 속에서 수사를 계속하면서도 수사 내용에 대해서는 철저하게 비밀을 유지했다."],summary:["서대문경찰서가 집중 수사를 계속했다.","비로 인해 현장 흔적이 사라질 가능성이 커졌다.","수사는 계속됐지만 뚜렷한 성과는 나오지 않았다.","경찰은 수사 내용을 비공개로 유지했다."],keywords:["수사난항","서대문경찰서","후속보도","죽첨정"]},{id:3,date:"1933.05.25",dateOld:"오월 이십오일",label:"수사 방침 재정비",labelOld:"방침을 다시 세움",image:"./image/Jukcheomjeong/articles-toned/19330525.jpg",title:"경찰, 수사 방향을 다시 세우다",modernText:["사건 발생 이후 여러 날이 지나도록 뚜렷한 성과가 나오지 않자 경찰은 수사 방향을 다시 논의하기 시작했다.","경기도 경찰부는 경성 시내 여러 경찰서 관계자들을 불러 그동안의 수사 진행 상황을 공유했다.","회의에서는 기존 조사 내용을 다시 검토하고 수사 방침을 정비해 각 경찰서가 협력해 수사를 이어가기로 했다."],summary:["수사가 장기화되면서 기존 수사 방향을 재검토했다.","여러 경찰서 관계자가 대책 회의를 열었다.","기존 조사 내용과 확보된 자료를 다시 검토했다.","경찰서 간 공조를 강화해 수사를 계속하기로 했다."],keywords:["수사회의","수사방침","경찰공조","죽첨정"]},{id:4,date:"1933.06.02",dateOld:"유월 이일",label:"유력 혐의선",labelOld:"혐의가 짙어짐",mark:"mis",image:"./image/Jukcheomjeong/articles-toned/19330602.jpg",title:"수사 17일째, 새로운 혐의선을 추적하다",modernText:["사건 발생 이후 경찰은 범인을 찾기 위한 수사를 계속했지만 정확한 범인을 특정하지 못하고 있었다.","그러던 중 죽첨정에 거주하던 한 가족이 새로운 혐의선에 오르면서 경찰 조사를 받게 됐다.","경찰은 당시 확보한 정황을 토대로 관련성을 조사하며 수사를 이어갔다. 이 단계에서 제기된 의혹은 아직 확정된 사실이 아니었다.","그러나 무죄의 증거는 처음부터 있었다. 이 집안의 가장은 5월 13일 병원에서 이미 숨졌고, 아이가 숨진 것은 빨라야 15일 밤이었다. 가족은 열흘 만에 풀려났다."],summary:["장기간 경찰 수사가 계속됐다.","죽첨정의 한 가족이 새로운 혐의선에 올랐다.","경찰이 관련 정황을 조사하기 시작했다.","당시 의혹은 아직 수사 단계의 가설이었다."],keywords:["혐의선","죽첨정","경찰수사","후속보도"]},{id:5,date:"1933.06.03",dateOld:"유월 삼일",label:"수사 확대",labelOld:"수사를 넓힘",image:"./image/Jukcheomjeong/articles-toned/19330603.jpg",title:"죽첨정 일대로 확대된 수사와 새로운 단서",modernText:["서대문경찰서는 사건 현장에서 멀지 않은 죽첨정·합동·중림동 일대를 중심으로 수사를 확대했다.","수사 과정에서 여러 사람이 조사를 받았고 경찰은 사건과 관련이 있을 가능성이 있는 물품들을 확인했다.","경찰은 확보한 자료와 관계자들의 설명을 비교하며 추가 조사를 이어갔다."],summary:["죽첨정 주변 지역으로 수사가 확대됐다.","여러 사람을 대상으로 조사가 진행됐다.","사건과 관련됐을 가능성이 있는 물품들이 조사됐다.","추가 확인을 위한 수사가 계속됐다."],keywords:["수사확대","죽첨정","단서","후속수사"]},{id:6,date:"1933.06.08",dateOld:"유월 팔일",label:"사건의 전환",labelOld:"사건이 뒤집힘",mark:"fix",image:"./image/Jukcheomjeong/articles-toned/19330608.jpg",title:"23일간 이어진 수사, 사건의 전모가 드러나다",modernText:["사건 발생 이후 20여 일이 지나면서 수사는 중요한 전환점을 맞았다.","경찰은 추가 조사 과정에서 사건과 관련된 새로운 사실을 확인했고 관계자들을 검거했다.","이에 따라 초기 수사 과정에서 제기됐던 여러 추정과 다른 사실들이
