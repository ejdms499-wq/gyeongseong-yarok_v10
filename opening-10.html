<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="yk-zoom.js"></script><!-- 화면 배율 120% -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>경성야록 — 자정의 호외 (판10 · 10.03)</title>
<!-- 휴대폰 글꼴: 아이폰 기본 글꼴과 가장 비슷한 Pretendard (인터넷이 없으면 기기 기본 고딕) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --room:#070605; --ink:#1d150e; --paper:#e7dbc2;
  --myeongjo:"Nanum Myeongjo","Noto Serif KR","Batang",serif;
  --ios:"SF Pro Display","SF Pro Text",-apple-system,"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--room);color:#d9d0c0;overflow:hidden;-webkit-user-select:none;user-select:none}
body{font-family:var(--myeongjo)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.skip{position:fixed;right:22px;top:18px;z-index:40;font-size:12px;letter-spacing:.2em;color:#6d6458;text-decoration:none}
.skip:hover{color:#d9d0c0}

/* ── 1. 입구 ── */
#gate{position:fixed;inset:0;z-index:10;display:grid;place-items:center;text-align:center;background:radial-gradient(ellipse at 50% 45%,#16120e,var(--room) 70%)}
#gate .k{font-size:12px;letter-spacing:.5em;color:#7d7366;margin-left:.5em}
#gate h1{font-weight:800;font-size:clamp(56px,calc(9vw / var(--ykz, 1)),96px);letter-spacing:.08em;color:#e8dfcf;margin:18px 0 6px}
#gate .s{font-size:14px;letter-spacing:.3em;color:#a39886;margin-left:.3em}
#gate .btns{display:flex;gap:14px;justify-content:center;margin-top:44px}
#gate .btns button{padding:11px 22px 10px;font-size:14px;letter-spacing:.24em;border:1px solid rgba(232,223,207,.45);color:#e8dfcf}
#gate .btns button:hover,#gate .btns button:focus-visible{background:#e8dfcf;color:var(--ink);outline:none}
#gate .btns .quiet{border-color:rgba(232,223,207,.18);color:#a39886}
#gate.out{opacity:0;transition:opacity .8s ease;pointer-events:none}

/* ── 2. 방 안의 휴대폰 ── */
#stage{position:fixed;inset:0;display:grid;place-items:center;opacity:0;transition:opacity 1.2s ease;overflow:hidden;
  background:
   radial-gradient(ellipse 55% 60% at 50% 55%,transparent,rgba(0,0,0,.85) 80%),
   repeating-linear-gradient(92deg,rgba(255,230,200,.018) 0 2px,transparent 2px 9px,rgba(0,0,0,.05) 9px 11px,transparent 11px 23px),
   linear-gradient(180deg,#140f0b,#0d0a08)}
/* 화면 빛이 책상에 번진다 (자정 전엔 푸르게, 뒤엔 누렇게) */
.glow{position:absolute;left:50%;top:50%;width:calc(110vh / var(--ykz, 1));height:calc(120vh / var(--ykz, 1));margin:calc(-60vh / var(--ykz, 1)) 0 0 calc(-55vh / var(--ykz, 1));border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse,rgba(120,150,210,.16),rgba(120,150,210,.05) 40%,transparent 65%);transition:background 2s,opacity .3s}
#stage.past .glow{background:radial-gradient(ellipse,rgba(235,205,150,.15),rgba(235,205,150,.05) 40%,transparent 65%)}
#stage.dim .glow{opacity:0}
.tilt{position:relative}
.tilt::after{content:"";position:absolute;left:8%;right:8%;bottom:-3%;height:8%;border-radius:50%;background:rgba(0,0,0,.7);filter:blur(20px);z-index:-1}
/* 누군가 책상 앞을 지나간다: 그림자만 */
.passer{position:fixed;top:-20%;bottom:-20%;width:calc(70vw / var(--ykz, 1));left:calc(-80vw / var(--ykz, 1));pointer-events:none;z-index:15;
  background:radial-gradient(ellipse 45% 55% at 50% 50%,rgba(0,0,0,.82),rgba(0,0,0,.4) 50%,transparent 75%)}
.passer.go{animation:pass 3.6s cubic-bezier(.45,0,.55,1) forwards}
@keyframes pass{0%{left:calc(-80vw / var(--ykz, 1))}100%{left:calc(110vw / var(--ykz, 1))}}
/* 진동: 책상 위에서 휴대폰이 떤다 */
.phone.buzz{animation:buzz .32s linear}
@keyframes buzz{0%,100%{translate:0 0;rotate:0deg}20%{translate:-2px 1px;rotate:-.5deg}40%{translate:2px -1px;rotate:.5deg}60%{translate:-2px 0;rotate:-.4deg}80%{translate:1px 1px;rotate:.3deg}}
#stage[hidden]{display:none}
#stage.on{opacity:1}
/* 화면 빛이 책상에 번지는 느낌 */
#stage::after{content:"";position:absolute;left:50%;top:50%;width:520px;height:720px;margin:-360px 0 0 -260px;border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse,rgba(150,170,210,.07),transparent 65%);transition:background 2s}
#stage.past::after{background:radial-gradient(ellipse,rgba(230,205,160,.08),transparent 65%)}

/* 기기: 티타늄 테두리, 측면 버튼. 화면은 실제 아이폰 크기(390×844pt)로 짜고 통째로 줄인다 */
.phone{position:relative;width:min(calc(92vw / var(--ykz, 1)),calc((calc(94vh / var(--ykz, 1)) - 24px) * 390 / 844 + 24px));padding:12px;border-radius:clamp(44px,calc(6.4vh / var(--ykz, 1)),70px);
  background:linear-gradient(135deg,#5b5954 0%,#2c2b29 16%,#1a1918 50%,#2e2c29 84%,#57534e 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),inset 0 0 0 4px #0c0b0a,0 50px 90px -40px #000;
  transition:transform 1.6s cubic-bezier(.6,0,.2,1)}
.phone::before,.phone::after{content:"";position:absolute;width:3px;border-radius:2px;background:linear-gradient(90deg,#1c1b1a,#4a4743)}
.phone::before{left:-3px;top:19%;height:4.5%;box-shadow:0 50px 0 0 #34312e,0 92px 0 0 #34312e}
.phone::after{right:-3px;top:27%;height:10%}
.screen{position:relative;width:100%;aspect-ratio:390/844;border-radius:clamp(36px,calc(5.3vh / var(--ykz, 1)),58px);overflow:hidden;touch-action:none;background:#000}
.screen::after{content:"";position:absolute;inset:0;z-index:25;pointer-events:none;border-radius:inherit;
  background:linear-gradient(118deg,transparent 28%,rgba(255,255,255,.07) 34%,rgba(255,255,255,.02) 42%,transparent 48%),
             radial-gradient(ellipse 120% 60% at 50% -10%,rgba(255,255,255,.05),transparent 60%)}
.ui{position:absolute;left:0;top:0;width:390px;height:844px;transform-origin:0 0;font-family:var(--ios);color:#fff;-webkit-font-smoothing:antialiased}
.wall{position:absolute;inset:0;transition:opacity 1.6s ease}
.wall.now{background:radial-gradient(ellipse 120% 70% at 30% 10%,#1d2a44 0%,transparent 60%),radial-gradient(ellipse 90% 60% at 80% 85%,#2a1b33 0%,transparent 65%),linear-gradient(180deg,#0a0f1c,#05060b 60%,#0b0710)}
.wall.then{opacity:0;background:#1b1712 url("assets/illust/gyeongseong_1925.jpg") 38% 50%/cover no-repeat;filter:grayscale(1) sepia(.55) contrast(1.15) brightness(.55)}
.wall.then::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,8,6,.55),rgba(10,8,6,.1) 35%,rgba(10,8,6,.6) 75%,rgba(10,8,6,.9))}
.island{position:absolute;left:50%;top:11px;width:126px;height:37px;margin-left:-63px;border-radius:20px;background:#000;z-index:9}
.status{position:absolute;left:0;right:0;top:0;height:54px;z-index:8;font-size:17px;font-weight:600;letter-spacing:-.02em}
.status #st-time{position:absolute;left:0;width:150px;top:17px;text-align:center}
.status .r{position:absolute;right:26px;top:19px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.lockic{position:absolute;left:50%;top:66px;margin-left:-7px;z-index:6;opacity:.9}
.lockic.shake{animation:lshake .5s ease}
@keyframes lshake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.fid{position:absolute;left:0;right:0;top:88px;text-align:center;z-index:7;font-size:14px;font-weight:500;color:rgba(255,255,255,.75);opacity:0;transition:opacity .3s}
.fid.on{opacity:1}
.fid.on ~ .date{opacity:0}
.date{position:absolute;left:0;right:0;top:96px;white-space:nowrap;text-align:center;z-index:6;font-size:21px;font-weight:600;letter-spacing:-.01em;color:rgba(255,255,255,.86)}
.clock{position:absolute;left:0;right:0;top:118px;text-align:center;z-index:6;font-size:102px;font-weight:600;letter-spacing:-.035em;line-height:1;
  color:rgba(255,255,255,.93);font-variant-numeric:tabular-nums;text-shadow:0 1px 20px rgba(0,0,0,.25)}
/* 라이브 액티비티(자정까지 남은 시간) */
.live{position:absolute;left:14px;right:14px;bottom:150px;z-index:6;padding:14px 16px 18px;border-radius:24px;display:flex;align-items:center;gap:12px;
  background:rgba(22,22,24,.6);-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12);
  transition:opacity .5s,transform .5s}
.live .ic{width:44px;height:44px;border-radius:11px;background:#1d150e;display:grid;place-items:center;font-family:var(--myeongjo);font-weight:800;font-size:22px;color:#e7dbc2;flex:none}
.live .t small{display:block;font-size:13px;color:rgba(255,255,255,.6);font-weight:500}
.live .t b{display:block;font-size:17px;font-weight:600;margin-top:1px}
.live .cd{margin-left:auto;font-size:36px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:#e9c46a}
.live .bar{position:absolute;left:16px;right:16px;bottom:8px;height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.live .bar i{display:block;height:100%;width:0;background:#e9c46a;transition:width .4s linear}
.hint{position:absolute;left:0;right:0;bottom:116px;text-align:center;z-index:6;font-size:15px;font-weight:500;color:rgba(255,255,255,.6);transition:opacity .4s}
.qb{position:absolute;bottom:50px;width:50px;height:50px;border-radius:50%;z-index:6;display:grid;place-items:center;
  background:rgba(40,40,44,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.qb.l{left:46px}.qb.r{right:46px}
.homebar{position:absolute;left:50%;bottom:8px;width:140px;height:5px;margin-left:-70px;border-radius:3px;background:rgba(255,255,255,.85);z-index:7}
.screen.slow .wall.now{filter:brightness(.6);transition:filter 2.4s}

/* 자정: 화면이 꺼졌다가 저절로 다시 켜진다 */
.dark{position:absolute;inset:0;background:#000;z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.screen.off .dark{opacity:1}
.screen.past .wall.now{opacity:0}
.screen.past .wall.then{opacity:1}
.screen.past .date{font-family:var(--myeongjo);font-weight:700;letter-spacing:.02em;color:rgba(240,228,205,.92)}
.screen.past .clock{color:rgba(244,234,214,.95)}
.screen.past .qb,.screen.past .hint{opacity:0;pointer-events:none}

/* 알림: iOS 잠금화면 알림 */
.notes{position:absolute;left:12px;right:12px;top:270px;bottom:96px;z-index:7;display:flex;flex-direction:column;justify-content:flex-end;gap:9px;overflow:hidden;
  -webkit-mask:linear-gradient(180deg,transparent 0,#000 70px);mask:linear-gradient(180deg,transparent 0,#000 70px)}
.note{position:relative;flex:none;padding:13px 15px 14px;border-radius:22px;display:grid;grid-template-columns:38px 1fr;column-gap:11px;
  background:rgba(34,32,30,.56);-webkit-backdrop-filter:blur(26px) saturate(1.3);backdrop-filter:blur(26px) saturate(1.3);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1);color:#fff;touch-action:pan-y;cursor:grab;
  transform:translateY(26px) scale(.96);opacity:0;transition:transform .5s cubic-bezier(.2,.9,.2,1),opacity .5s ease}
.note.in{transform:none;opacity:1}
.note.gone{transform:translateX(-115%)!important;opacity:0!important;transition:transform .3s ease-in,opacity .3s ease-in}
.note.stay{animation:stay .45s ease}
@keyframes stay{30%{transform:translateX(-18px)}60%{transform:translateX(7px)}100%{transform:none}}
.note .ic{grid-row:1/3;width:38px;height:38px;border-radius:9px;align-self:start;margin-top:2px;background:#e7dbc2;color:#1d150e;display:grid;place-items:center;
  font-family:var(--myeongjo);font-weight:800;font-size:19px}
.note .hd{display:flex;align-items:baseline;gap:6px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.note .hd em{margin-left:auto;font-style:normal;font-size:13px;font-weight:400;color:rgba(255,255,255,.55);white-space:nowrap}
.note .bd{font-size:15px;line-height:1.35;letter-spacing:-.01em;color:rgba(255,255,255,.92)}
.note.today{background:rgba(231,219,194,.88);color:#1d150e}
.note.today .ic{background:#1d150e;color:#e7dbc2}
.note.today .hd em,.note.today .bd{color:rgba(29,21,14,.72)}
.screen:not(.past) .notes{bottom:262px;top:250px}
.note.now2026{opacity:1;transform:none;transition:opacity .3s,filter .3s}
.note.aging .hd em{color:#f0d79a;font-weight:700;font-size:14px}
.note.fall{animation:fall 1.1s cubic-bezier(.5,0,.9,.5) forwards}
@keyframes fall{0%{transform:none;opacity:1}20%{transform:translateY(-6px) rotate(-1deg)}100%{transform:translateY(420px) rotate(7deg);opacity:0}}
.note.now2026 .ic{background:#fff;color:#111;font-family:var(--ios);font-size:17px}
.screen.past .wall.then{animation:creep 40s linear forwards}
@keyframes creep{from{transform:scale(1)}to{transform:scale(1.18) translateY(3%)}}
.note{user-select:none;-webkit-user-select:none}
.screen.hush .wall.then{filter:grayscale(1) sepia(.55) contrast(1.2) brightness(.28);transition:filter 1.4s}
.screen.hush .lockbox{opacity:.45;transition:opacity 1.4s}
.note.voice{padding:20px 18px 22px;background:rgba(14,12,10,.82);box-shadow:inset 0 0 0 1px rgba(231,219,194,.35)}
.note.voice .bd{font-size:21px!important;line-height:1.5;color:#f1e6cf;letter-spacing:.02em}
.note.voice .hd{font-size:15px}
.note.voice .bd{font-family:var(--myeongjo);font-weight:700;font-size:16px}
.count{position:absolute;left:0;right:0;top:244px;z-index:7;text-align:center;font-size:15px;font-weight:500;color:rgba(255,255,255,.6);opacity:0;transition:opacity .4s}
.count.on{opacity:1}
.up{position:absolute;left:0;right:0;bottom:26px;z-index:8;text-align:center;font-size:15px;font-weight:500;color:rgba(255,255,255,.78);opacity:0;pointer-events:none;transition:opacity .6s}
.up.on{opacity:1;pointer-events:auto;animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,70%,100%{transform:none}35%{transform:translateY(-6px)}}
.screen.dragging .lockbox,.screen.dragging .notes{transition:none}
.lockbox{position:absolute;inset:0;z-index:6;pointer-events:none}

/* 열람: 화면이 지면으로 번져 메인으로 */
.veil{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:30;transition:opacity .7s ease .6s}
/* 윤전기: 문장이 떨리다가, 굉음과 함께 그날의 지면들이 쏟아져 내린다 */
.epi.tremble .t{animation:tremble .09s linear infinite}
@keyframes tremble{0%{transform:translate(0,0)}25%{transform:translate(-1.5px,1px)}50%{transform:translate(1px,-1px)}75%{transform:translate(-1px,-.5px)}100%{transform:translate(1.5px,1px)}}
.epi.gone{opacity:0;transition:opacity .05s}
.burst{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden;display:none}
.burst.on{display:block;animation:jolt .5s cubic-bezier(.3,0,.3,1)}
@keyframes jolt{0%{transform:scale(1.06) translate(0,0)}15%{transform:scale(1.04) translate(-9px,6px)}30%{transform:scale(1.03) translate(7px,-5px)}50%{transform:scale(1.015) translate(-4px,3px)}100%{transform:none}}
.flash{position:fixed;inset:0;z-index:45;background:#f4ecda;opacity:0;pointer-events:none}
.flash.on{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.sheet{position:absolute;left:50%;top:0;width:min(1100px,calc(96vw / var(--ykz, 1)));height:calc(100vh / var(--ykz, 1));margin-left:calc(min(1100px,calc(96vw / var(--ykz, 1))) / -2);
  background:linear-gradient(90deg,rgba(60,40,20,.08),transparent 4%,transparent 96%,rgba(60,40,20,.08)),
             repeating-linear-gradient(0deg,rgba(60,45,30,.035) 0 1px,transparent 1px 3px),#e8dcc3;
  box-shadow:0 30px 60px rgba(0,0,0,.6),0 -30px 60px rgba(0,0,0,.6);transform:translateY(-115%) rotate(var(--r));filter:blur(.6px)}
.sheet.fly{animation:fly var(--dur) cubic-bezier(.5,0,.7,1) forwards}
.sheet.land{animation:land .42s cubic-bezier(.2,.9,.25,1) forwards;filter:none}
@keyframes fly{to{transform:translateY(118%) rotate(calc(var(--r) * -1))}}
@keyframes land{0%{transform:translateY(-115%) rotate(var(--r))}75%{transform:translateY(1.2%) rotate(0deg)}100%{transform:none}}
.sheet .mh{position:absolute;left:6%;right:6%;top:4%;padding-bottom:1.2%;border-bottom:3px double #1d150e;text-align:center;font-family:var(--myeongjo);font-weight:800;font-size:clamp(28px,calc(5vh / var(--ykz, 1)),52px);letter-spacing:.3em;color:#1d150e}
.sheet .hd{position:absolute;right:7%;top:17%;writing-mode:vertical-rl;font-family:var(--myeongjo);font-weight:900;font-size:clamp(46px,calc(10vh / var(--ykz, 1)),104px);line-height:1.12;letter-spacing:.04em;color:#1d150e;max-height:76%}
.sheet .cols{position:absolute;left:6%;right:28%;top:17%;bottom:6%;
  background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 10px),rgba(29,21,14,.25) calc(25% - 10px) calc(25% - 9px),transparent calc(25% - 9px) 25%),
             repeating-linear-gradient(0deg,rgba(29,21,14,.32) 0 2px,transparent 2px 9px)}
.sheet .ph{position:absolute;left:10%;top:24%;width:30%;aspect-ratio:4/3;background:#4b4036;filter:contrast(1.1)}
/* 마지막: 검은 방에 남는 한 줄, 그리고 종이가 현상되듯 */
.epi{position:fixed;inset:0;z-index:35;display:grid;place-content:center;text-align:center;pointer-events:none;opacity:0;transition:opacity 1.6s ease}
.epi.on{opacity:1}
.epi .paper{position:absolute;inset:0;background:var(--paper);clip-path:circle(0% at 50% 50%);transition:clip-path 2s cubic-bezier(.55,0,.3,1)}
.epi .paper::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 30%,rgba(60,40,20,.3));opacity:1;transition:opacity 2s}
.epi.dev .paper{clip-path:circle(150% at 50% 50%)}
.epi.dev .paper::after{opacity:0}
.epi p{position:relative;font-family:var(--myeongjo);color:#e9dfcc;transition:color 1.6s ease .3s}
.epi .d{font-size:clamp(16px,calc(1.8vw / var(--ykz, 1)),24px);letter-spacing:.3em;margin-bottom:22px;opacity:.75}
.epi .t{font-size:min(56px,max(22px,calc((calc(100vw / var(--ykz, 1)) - 80px) / 17)));font-weight:800;letter-spacing:.08em;white-space:nowrap}
.epi .t i{font-style:normal;display:inline-block;transition:transform .35s cubic-bezier(.5,0,.8,.3),opacity .35s ease,max-width .45s ease .25s,margin .45s ease .25s;max-width:2em;overflow:visible}
.epi .t i.sp{width:.32em}
.epi .t i.pull{transform:translateY(-.9em);opacity:0;max-width:0;margin:0}
.epi.dev p{color:var(--ink)}
.leave .notes,.leave .lockbox,.leave .up,.leave .status{opacity:0;transition:opacity .35s ease}
.leave .screen .dark{opacity:1;transition:opacity .35s ease .2s}
.leave .glow{opacity:0;transition:opacity .5s ease .2s}
.leave .veil{opacity:1}

@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style>
</head>
<body>
<a class="skip" href="index.html" id="skip">건너뛰기</a>
<span style="position:fixed;left:14px;bottom:10px;z-index:40;font:11px/1 sans-serif;color:#3d3830;letter-spacing:.1em">판10 · 10.03</span>

<section id="gate" aria-label="경성야록 입구">
  <div>
    <p class="k">경성야록 · 납량 특집</p>
    <h1>0:00</h1>
    <p class="s">자정의 호외</p>
    <div class="btns">
      <button type="button" id="go-sound">호외 받기</button>
      <button type="button" id="go-quiet" class="quiet">소리 없이 보기</button>
    </div>
  </div>
</section>

<script>
/* 화면 줄이기: 390pt 기준 화면을 실제 폭에 맞춘다 */
const ui=document.getElementById('ui');
function fit(){ const w=document.getElementById('screen').clientWidth; if(w) ui.style.transform=`scale(${w/390})`; }
addEventListener('resize',fit);

/* 메인 주소: 폴더 그대로면 index.html, 서버에서 주소가 다르면 여기만 바꾸면 됨 */
const MAIN_URL='index.html';

/* 호외: 메인 칸의 실제 사건. 처음엔 당시 말투, 갖다 대면 국한문 */
const NOW=new Date(), Y=NOW.getFullYear();
const NEWS=[
  {y:1924,ko:"황금정 한 집에 밤마다 독갑이 소동",hj:"황금정 한 집에 밤마다 도깨비 소동"},
  {y:1924,ko:"'본부독살 미인' 사형 불복",hj:"'남편 독살 미인' 사형 판결에 불복"},
  {y:1926,ko:"현해탄 연락선에서 두 남녀 자최를 감초다",hj:"현해탄 연락선에서 두 남녀가 사라지다"},
  {y:1923,ko:"미두왕 반복창, 사긔 혐의로 피착",hj:"쌀 투기왕 반복창, 사기 혐의로 체포"},
  {y:1927,ko:"대구 모사건 돌발",hj:"대구에서 '어떤 사건' 발생 (보도 통제)"},
  {y:1927,ko:"경주분관 순금 유물 감쪽가치 업서저",hj:"경주분관 순금 유물 감쪽같이 사라져"},
  {y:1931,ko:"부산 초량정 관사에서 스무 살 하녀 참살",hj:"부산 초량동 관사에서 스무 살 가정부 살해"},
  {y:1933,ko:"죽첨정 골목에서 어린 아해의 시톄 발견",hj:"죽첨정 골목에서 어린아이 시신 발견"},
  {y:1936,ko:"본보, 손기정 군 가슴의 일장기를 지우다",hj:"동아일보, 손기정 가슴의 일장기를 지우다"},
  {y:1937,ko:"백백교 산중의 행방불명, 비로소 드러나",hj:"백백교 산속의 실종자들, 비로소 드러나"}
];
const GAP=90, past=new Date(Y-GAP,NOW.getMonth(),NOW.getDate());
const stopped=past>=new Date(1936,7,29)&&past<new Date(1937,5,3);
const TODAY=stopped?{ko:"이날 본보는 발행되지 못하엿다 — 정간 중",hj:"이날 동아일보는 발행되지 못했다 — 정간 중"}
                   :{ko:"구십 년 전 오늘의 본보를 펼치시오",hj:"90년 전 오늘의 신문을 펼쳐 보세요"};
const VOICE={ko:"넘기지 마시오. 아즉 다 읽지 아니하얏소.",hj:"넘기지 마세요. 아직 다 읽지 않았어요."};

/* 소리: '호외 받기'를 고른 경우만 */
let ctx=null, sound=false;
const ac=()=>{if(!ctx){const A=window.AudioContext||window.webkitAudioContext; if(A)ctx=new A();} return ctx;};
function tone(f,t,dur,g,type='sine'){const c=ac(); if(!c||!sound)return; const o=c.createOscillator(),v=c.createGain();
  o.type=type; o.frequency.value=f; v.gain.setValueAtTime(.0001,t); v.gain.exponentialRampToValueAtTime(g,t+.005); v.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(v); v.connect(c.destination); o.start(t); o.stop(t+dur+.05);}
const tick=(g=.05)=>{const c=ac(); if(c) tone(2400,c.currentTime,.025,g,'square');};
function bell(){const c=ac(); if(!c)return; const t=c.currentTime;
  [[130.8,.55,6],[261.6,.3,5],[392,.14,3.6],[523,.09,2.6],[698,.05,1.6],[1046,.03,1]].forEach(([f,g,d])=>tone(f,t,d,g));}
function shakePhone(){const ph=document.getElementById('phone'); ph.classList.remove('buzz'); void ph.offsetWidth; ph.classList.add('buzz');}
function buzz(){shakePhone(); const c=ac(); if(!c||!sound)return; const t=c.currentTime; [0,.16].forEach(dt=>tone(140,t+dt,.11,.18,'sawtooth'));}

/* 화면 요소 */
const $=id=>document.getElementById(id);
const gate=$('gate'), stage=$('stage'), screen=$('screen'), clockEl=$('clock'), dateEl=$('date'), hint=$('hint'), notes=$('notes'), up=$('up'), live=$('live'), cd=$('cd'), bar=$('barfill'), count=$('count');
const WD="일월화수목금토";
document.getElementById('live-s').textContent=`경성야록 · ${Y}년`;
const yday=new Date(NOW); yday.setDate(yday.getDate()-1);
dateEl.textContent=`${yday.getFullYear()}년 ${yday.getMonth()+1}월 ${yday.getDate()}일 ${WD[yday.getDay()]}요일`;

function enter(withSound){ sound=withSound; if(sound){const c=ac(); if(c&&c.state==='suspended')c.resume();}
  gate.classList.add('out'); stage.hidden=false; fit(); requestAnimationFrame(()=>{fit(); stage.classList.add('on');});
  setTimeout(()=>{gate.remove(); screen.focus({preventScroll:true});},800);}
$('go-sound').addEventListener('click',()=>enter(true));
$('go-quiet').addEventListener('click',()=>enter(false));

/* ── 2026년 잠금화면에 이미 와 있는 알림 (발표 당일 실제 헤드라인으로 바꿔도 됨) ── */
const NOW_NOTES=[
  {app:'동아일보',ic:'東',t:'1분 전',ko:'오늘 자정, 납량 특집 「경성야록」 첫 호가 열립니다'},
  {app:'동아일보',ic:'東',t:'2시간 전',ko:`창간호부터 오늘 자까지, 지면 ${Y-1920}년이 한곳에 · 동아디지털아카이브`},
  {app:'시계',ic:'⏰',t:'알람',ko:'내일 오전 7:00'}
];
function plainNote(n){ const a=document.createElement('article'); a.className='note now2026 in'; a.tabIndex=-1;
  a.innerHTML=`<span class="ic">${n.ic}</span><p class="hd">${n.app}<em>${n.t}</em></p><p class="bd">${n.ko}</p>`; return a; }
NOW_NOTES.forEach(n=>notes.append(plainNote(n)));

/* ── 꾹 누르기: 누르는 즉시 흐르고, 손가락이 조금 움직여도 끊기지 않는다. 떼면 멈추고, 다시 누르면 이어진다 ── */
let left=10, timer=null, phase='hold', holdId=null;
const STEP=[0,700,520,400,300,240,200,200,200,200,200]; // 남은 초에 따른 간격(ms): 마지막 세 초가 느려짐
function press(){ if(phase!=='hold'||timer)return; screen.classList.add('pressing'); step(); }
function step(){ left--; tick(left<3?.09:.05); show(); if(left<=3) screen.classList.add('slow');
  if(left<=0){ release(); midnight(); return; } timer=setTimeout(step,STEP[left]); }
function release(){ clearTimeout(timer); timer=null; screen.classList.remove('pressing'); holdId=null; }
function show(){ cd.textContent='0:'+String(left).padStart(2,'0'); bar.style.width=((10-left)*10)+'%'; }
screen.addEventListener('pointerdown',e=>{ if(phase!=='hold')return; e.preventDefault(); holdId=e.pointerId; try{screen.setPointerCapture(e.pointerId)}catch(_){} press(); });
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>screen.addEventListener(ev,e=>{ if(phase==='hold'&&(holdId===null||e.pointerId===holdId)) release(); }));
screen.addEventListener('keydown',e=>{ if(phase==='hold'&&(e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault(); press();} });
screen.addEventListener('keyup',e=>{ if(phase==='hold'&&(e.key===' '||e.key==='Enter')) release(); });
screen.addEventListener('contextmenu',e=>e.preventDefault());

/* ── 자정 ── */
function koNum(n){const D=['','일','이','삼','사','오','륙','칠','팔','구'];if(n<10)return D[n];const t=Math.floor(n/10),u=n%10;return (t>1?D[t]:'')+'십'+D[u];}
function midnight(){
  phase='midnight'; clockEl.textContent='0:00'; $('st-time').textContent='0:00'; hint.style.opacity=0;
  dateEl.textContent=`${Y}년 ${NOW.getMonth()+1}월 ${NOW.getDate()}일 ${WD[NOW.getDay()]}요일`; cd.textContent='0:00'; bar.style.width='100%';
  bell(); thud();
  setTimeout(()=>{screen.classList.add('off'); stage.classList.add('dim');},600);
  setTimeout(()=>{
    screen.classList.remove('off'); stage.classList.remove('dim'); screen.classList.remove('slow');
    $('live-s').textContent='경성야록'; $('live-t').textContent='연도'; cd.style.color='#f0e2c4';
    let yy=Y; cd.textContent=yy; bar.style.width='100%';
    const olds=[...notes.querySelectorAll('.now2026')];
    setTimeout(()=>{ const r=setInterval(()=>{ yy--; cd.textContent=yy; bar.style.width=((yy-(Y-GAP))/GAP*100)+'%'; tick(.02);
      // 2026년의 알림이 함께 늙어간다
      const k=1-(yy-(Y-GAP))/GAP;
      olds.forEach((o,i)=>{ o.querySelector('em').textContent=`${Y-yy}년 전`; o.classList.add('aging'); o.style.filter=`sepia(${k}) brightness(${1-k*.45}) contrast(${1+k*.3})`;
        if(k>.55+i*.12 && !o.dataset.fell){ o.dataset.fell=1; o.classList.add('fall'); buzz(); } });
      if(yy%9===0) $('st-time').textContent=['0:00','23:59','0:00'][yy%3];
      if(yy<=Y-GAP){ clearInterval(r); olds.forEach(o=>o.remove()); toPast(); } },32); },900);
  },1900);
}
function toPast(){
  $('st-time').textContent='0:00'; thud();
  screen.classList.add('past'); stage.classList.add('past');
  $('st-net').textContent='서비스 없음'; $('bat').setAttribute('width','3');
  const m=NOW.getMonth()+1, d=NOW.getDate();
  dateEl.textContent=`소화 ${koNum(Y-GAP-1925)} 년 ${m===10?'시':m===6?'류':koNum(m)}월 ${koNum(d)}일 ${WD[past.getDay()]}요일`;
  setTimeout(()=>{ live.style.opacity=0; dropNotes(); },2200);
}
function thud(){ const c=ac(); if(c){ tone(55,c.currentTime,.9,.35); tone(82,c.currentTime,.6,.15); } }

/* ── 호외가 저절로, 점점 빠르게 쌓인다 ── */
let dropped=0, swiped=0, voiced=false, total=0;
function hoverSwap(el){ let on=false; const sw=()=>{const t=el.textContent; el.textContent=el.dataset.ko; el.dataset.ko=t; on=!on;};
  el.addEventListener('mouseenter',()=>{ if(!on)sw(); }); el.addEventListener('mouseleave',()=>{ if(on)sw(); });
  if(!matchMedia('(hover: hover)').matches) el.addEventListener('click',sw); }
function makeNote(item,kind,ago){
  const n=document.createElement('article'); n.className='note'+(kind?' '+kind:''); n.tabIndex=0;
  const app=kind==='today'?'동아일보':'경성야록';
  n.innerHTML=`<span class="ic">${kind==='today'?'東':'野'}</span><p class="hd">${app}<em>${ago}</em></p><p class="bd"><span class="hj" data-ko="${item.hj}">${item.ko}</span></p>`;
  n.setAttribute('aria-label',`${app}, ${ago}. ${item.ko}`);
  hoverSwap(n.querySelector('.hj')); swipeable(n,kind==='today'); return n;
}
let silent=false;
function recount(){ const k=notes.querySelectorAll('.note:not(.voice):not(.now2026)').length; count.textContent=`호외 ${k}건`; count.classList.toggle('on',!silent&&k>3); }
function add(n){ notes.append(n); total++; buzz(); requestAnimationFrame(()=>requestAnimationFrame(()=>n.classList.add('in'))); recount(); }
function dropNotes(){
  phase='notes';
  const list=[...NEWS].sort(()=>Math.random()-.5).slice(0,5);
  const go=()=>{
    if(dropped<list.length){ const it=list[dropped]; add(makeNote(it,'',`${Y-it.y}년 전`)); dropped++; heart(dropped);
      setTimeout(go,520); }
    else { add(makeNote(TODAY,'today',`${GAP}년 전 오늘`)); hint.textContent='호외를 옆으로 밀어 넘기시오'; hint.style.bottom='62px'; hint.style.opacity=1; hint.style.zIndex=8;
      setTimeout(()=>{ if(!up.classList.contains('on')) showUp(); },3500); }
  };
  go();
}
/* 알림이 빨라질수록 낮은 고동이 빨라진다 */
function heart(k){ const c=ac(); if(!c)return; tone(48,c.currentTime,.22,.25); }

/* 밀어 넘기기: 손가락을 그대로 따라오고, 조금만 밀거나 빠르게 튕겨도 넘어간다 */
function swipeable(n,locked){
  let x0=null,dx=0,t0=0,id=null;
  n.addEventListener('pointerdown',e=>{ e.stopPropagation(); x0=e.clientX; dx=0; t0=performance.now(); id=e.pointerId; n.setPointerCapture(id); n.style.transition='none'; });
  n.addEventListener('pointermove',e=>{ if(x0===null||e.pointerId!==id)return; dx=e.clientX-x0; n.style.transform=`translateX(${locked?dx*.35:dx}px) rotate(${dx*.01}deg)`; });
  const end=e=>{ if(x0===null)return; const v=Math.abs(dx)/Math.max(1,performance.now()-t0); x0=null; n.style.transition='';
    if(Math.abs(dx)>45||v>.45){
      if(locked){ n.style.transform=''; buzz(); return; }
      n.style.transform=`translateX(${dx<0?-130:130}%)`; n.style.opacity=0; swiped++; setTimeout(()=>{n.remove(); recount();},300);
    } else n.style.transform=''; };
  n.addEventListener('pointerup',end); n.addEventListener('pointercancel',end);
  n.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft'||e.key==='Delete'){ dx=-100; x0=0; t0=performance.now()-50; end(); } });
}

/* ── 위로 쓸어올려 열람: 화면 어디서든 위로 쓸면 바로. 첫 번째는 얼굴을 알아보지 못한다 ── */
function showUp(){ if(up.classList.contains('on')||phase==='open')return; up.classList.add('on'); hint.style.opacity=0; phase='open'; }
function rustle(){ const c=ac(); if(!c||!sound)return; const len=Math.floor(c.sampleRate*.9), b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<len;i++){ const e=Math.sin(Math.PI*i/len); d[i]=(Math.random()*2-1)*e*(.6+.4*Math.sin(i/900)); }
  const n=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain(); n.buffer=b; f.type='bandpass'; f.frequency.value=2600; f.Q.value=.7; g.gain.value=.25;
  n.connect(f); f.connect(g); g.connect(c.destination); n.start(); }
function noise(dur,freq,q,gain,t0){ const c=ac(); if(!c||!sound)return; const len=Math.floor(c.sampleRate*dur), b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1);
  const n=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain(); n.buffer=b; f.type='bandpass'; f.frequency.value=freq; f.Q.value=q;
  const t=c.currentTime+(t0||0); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(gain,t+dur*.15); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  n.connect(f); f.connect(g); g.connect(c.destination); n.start(t); }
function rumble(){ const c=ac(); if(!c||!sound)return; const t=c.currentTime, o=c.createOscillator(), g=c.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(28,t); o.frequency.linearRampToValueAtTime(52,t+1.3);
  const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=180; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.35,t+1.25); g.gain.exponentialRampToValueAtTime(.0001,t+1.45);
  o.connect(f); f.connect(g); g.connect(c.destination); o.start(t); o.stop(t+1.5); noise(1.4,120,.8,.25); }
function slam(){ const c=ac(); if(!c)return; tone(42,c.currentTime,1.6,.7); tone(63,c.currentTime,.9,.4,'triangle'); noise(.5,900,.6,.55); noise(.25,3200,1.2,.3);
  tone(523,c.currentTime+.02,1.2,.05,'square'); tone(784,c.currentTime+.02,.9,.03,'square'); }
function swish(t0){ noise(.22,2400,.7,.18,t0); }
function clack(){ const c=ac(); if(!c||!sound)return; const t=c.currentTime; tone(1100,t,.035,.12,'square'); tone(180,t,.08,.2,'triangle'); }
const SHEETS=['죽첨정 골목의 어린 주검','부산 마리아 참살','대구 모사건 돌발','백백교 산중의 행방불명','현해탄에 자최를 감초다','금관만 남엇다','독갑이 집','손기정 군 가슴의 표지'];
function leave(){
  document.body.classList.add('leave'); thud();
  const ep=$('epi'), m=NOW.getMonth()+1, d=NOW.getDate();
  const date=`소화 ${koNum(Y-GAP-1925)} 년 ${m===10?'시':m===6?'류':koNum(m)}월 ${koNum(d)}일`;
  $('epi-d').textContent=date;
  const line=stopped?'이날 본보는 발행되지 못하엿다.':TODAY.ko;
  const cut=stopped?line.indexOf('지 못하'):-1, cutLen=4;
  $('epi-t').innerHTML=[...line].map((ch,k)=>`<i class="${ch===' '?'sp':''}${cut>=0&&k>=cut&&k<cut+cutLen?' x':''}">${ch===' '?'&nbsp;':ch}</i>`).join('');
  setTimeout(()=>ep.classList.add('on'),1200);                       // 검은 방에 한 줄
  let t=4200;
  if(stopped){ [...$('epi-t').querySelectorAll('i.x')].reverse().forEach((el,k)=>setTimeout(()=>{ el.classList.add('pull'); clack(); },t+k*420)); t+=cutLen*420+1300; }
  // 정적 뒤, 문장이 떨리기 시작하고 바닥에서 윤전기가 깨어난다
  setTimeout(()=>{ ep.classList.add('tremble'); rumble(); },t);
  t+=1350;
  // 쾅: 섬광, 화면이 들썩이고, 그날 밤의 지면들이 쏟아져 내린다
  setTimeout(()=>{
    ep.classList.add('gone'); slam(); $('flash').classList.add('on');
    const b=$('burst'); b.innerHTML=''; b.classList.add('on');
    const n=SHEETS.length;
    SHEETS.forEach((h,k)=>{ const sh=document.createElement('div'); sh.className='sheet';
      sh.style.setProperty('--r',((k%2?1:-1)*(1+k*.35))+'deg'); sh.style.setProperty('--dur',(.34-k*.018)+'s');
      sh.innerHTML=`<p class="mh">경성야록</p><p class="hd">${h}</p><div class="cols"></div>${k%3===0?'<div class="ph"></div>':''}`;
      b.appendChild(sh); setTimeout(()=>{ sh.classList.add('fly'); swish(0); },60+k*95); });
    // 마지막 한 장이 떨어져 멈춘다: 오늘 밤의 지면
    const last=document.createElement('div'); last.className='sheet'; last.style.setProperty('--r','-1.5deg');
    last.innerHTML=`<p class="mh">경성야록</p><div class="cols" style="right:6%"></div>`;
    b.appendChild(last);
    setTimeout(()=>{ last.classList.add('land'); setTimeout(()=>thud(),330); },60+n*95+120);
    setTimeout(()=>{ location.href=MAIN_URL+'#yarok=press'; },60+n*95+120+900);
  },t);
}
let y0=null, ty0=0;
screen.addEventListener('pointerdown',e=>{ if(phase!=='open')return; y0=e.clientY; ty0=performance.now(); try{screen.setPointerCapture(e.pointerId)}catch(_){} screen.classList.add('dragging'); });
screen.addEventListener('pointermove',e=>{ if(y0===null)return; const d=Math.min(0,e.clientY-y0); $('lockbox').style.transform=`translateY(${d*.6}px)`; notes.style.transform=`translateY(${d}px)`; });
screen.addEventListener('pointerup',e=>{ if(y0===null)return; const d=e.clientY-y0, v=-d/Math.max(1,performance.now()-ty0); y0=null; screen.classList.remove('dragging');
  $('lockbox').style.transform=''; notes.style.transform='';
  if(d<-50||v>.5) open(); });
up.addEventListener('click',open);
up.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '||e.key==='ArrowUp'){e.preventDefault(); open();} });
let tries=0, busy=false;
function open(){ if(document.body.classList.contains('leave')||busy)return;
  if(tries===0){ tries++; busy=true; refuse(); return; }
  leave(); }
function refuse(){
  const li=$('lockic'), f=$('fid');
  up.classList.remove('on'); hint.style.opacity=0;
  li.classList.remove('shake'); void li.getBoundingClientRect(); li.classList.add('shake'); buzz();
  f.textContent='얼굴을 알아볼 수 없음'; f.classList.add('on');
  // 정적: 호외가 모두 사라지고 화면이 가라앉는다
  setTimeout(()=>{ silent=true; count.classList.remove('on');
    notes.querySelectorAll('.note').forEach(x=>{x.style.transition='opacity .5s'; x.style.opacity=0; setTimeout(()=>x.remove(),500);});
    screen.classList.add('hush'); f.classList.remove('on'); },900);
  // 넘겼던 것까지, 호외가 한꺼번에 되돌아온다
  setTimeout(()=>{ thud(); silent=false;
    const back=[...NEWS].sort(()=>Math.random()-.5); let k=0;
    const r=setInterval(()=>{ if(k<back.length){ const it=back[k++]; add(makeNote(it,'',`${Y-it.y}년 전`)); heart(k); }
      else { clearInterval(r); add(makeNote(TODAY,'today',`${GAP}년 전 오늘`));
        setTimeout(()=>{ silent=true; count.classList.remove('on'); add(makeNote(VOICE,'voice','지금')); thud();
          setTimeout(()=>{ up.textContent='다시 쓸어올려 열람'; up.classList.add('on'); busy=false; },1800); },900); } },85);
  },2400);
}
$('skip').href=MAIN_URL;
</script>
