<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Song+Myung&display=swap" rel="stylesheet"><svg width="0" height="0" style="position:absolute"><filter id="lp"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter></svg><style>

.hero{grid-template-columns:minmax(0,1fr) 250px !important}

.sub{order:1;writing-mode:vertical-rl;font-family:"Song Myung",serif;font-size:13.5px;line-height:1.7;color:#cdbf9f;border-right:0!important;padding-right:10px!important;margin:0!important;height:100%!important}
.title{order:2;writing-mode:vertical-rl;font-family:"Song Myung",serif !important;font-weight:400 !important;font-size:52px !important;line-height:1.08 !important;letter-spacing:0 !important;

.kick{font-family:"Noto Serif KR","Noto Serif CJK KR",serif!important;text-align:start!important;text-align-last:auto!important;font-size:13px!important;line-height:1.3;white-space:nowrap}.kick em{font-style:normal;font-size:11px;opacity:.8;margin-top:10px;display:inline-block}
.panel{grid-template-columns:auto auto auto!important}.sub{max-width:62px}</style></head><body><div class="hero"><div style="position:relative;height:216px;min-width:0;overflow:hidden"><img src="images/social-1933-05-17.jpg" style="object-fit:cover;object-position:center 40%"><span class="cap">▲1933.5.17 本紙 석간. 금화장 현장 (실제 지면)</span></div><div class="panel"><span class="kick">社會面 <em>一九三三</em></span><h2 class="title">죽첨정<br>괴사건</h2><p class="sub">매립지의 새벽,<br>신문은 엉뚱한 가족을 지목했다</p></div></div><div class="hero"><div style="position:relative;height:216px;min-width:0;overflow:hidden"><img src="images/fraud-1940-03-14.jpg" style="object-fit:cover;object-position:center"><span class="cap">▲1940.3.14 本紙 석간. 용수를 쓴 피고들 (실제 지면)</span></div><div class="panel"><span class="kick">詐欺面 <em>一九三七</em></span><h2 class="title">벼슬을<br>판교주</h2><p class="sub">헌금에 따라 대신 자리를 팔고,<br>산속에 신도들을 묻었다</p></div></div><div class="hero"><div style="position:relative;height:216px;min-width:0;overflow:hidden"><img src="images/culture-1936-08-25.jpg" style="object-fit:cover;object-position:center"><span class="cap">▲1936.8.25 本紙. 손기정 선수 시상 사진 (실제 지면)</span></div><div class="panel"><span class="kick">文化面 <em>一九三六</em></span><h2 class="title">지워진<br>일장기</h2><p class="sub">이 사진 한 장으로<br>신문은 279일 멈췄다</p></div></div></body></html>
